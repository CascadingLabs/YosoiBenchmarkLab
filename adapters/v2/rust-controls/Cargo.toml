[package]
name = "yosoi-benchmark-v2-controls"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.100"
regex = "1.12.2"
roxmltree = "0.21.1"
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
