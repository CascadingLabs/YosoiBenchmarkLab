[package]
name = "yosoi-benchmark-rust-scraper"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.100"
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"

[dev-dependencies]
criterion = { version = "0.7.0", default-features = false }

[[bench]]
name = "caveman"
harness = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
